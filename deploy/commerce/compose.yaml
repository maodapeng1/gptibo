name: gptibo-shop
x-environment: &environment
  DB_HOST: postgres
  DB_NAME: storefront
  DB_USER: storefront_app
  DB_PASSWORD_FILE: /run/secrets/app_password
  DB_SSLMODE: disable
  WORKER_ID: commerce-worker
  PUBLIC_ORIGIN: https://shop.aichongzhi.best
  AUTH_SECRET_FILE: /run/secrets/auth_secret
  MAIL_ENABLED: "false"
  FULFILLMENT_ENABLED: "true"
  FULFILLMENT_ORIGIN: https://relay.aichongzhi.best
  FULFILLMENT_SECRET_FILE: /run/secrets/fulfillment_secret
  FULFILLMENT_PRODUCT_MAP: '{"plus":{"plan":"chatgptplusplan","region":"PH"}}'
x-runtime: &runtime
  image: gptibo-storefront:local
  entrypoint: [/app/storefront]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes: [./storefront:/app/storefront:ro]
  secrets: [app_password, auth_secret, fulfillment_secret]
  depends_on:
    postgres:
      condition: service_healthy
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_password
    secrets: [owner_password]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U storefront_owner -d storefront]
      interval: 5s
      timeout: 3s
      retries: 20
  maintenance:
    <<: *runtime
    profiles: [maintenance]
    restart: "no"
    command: [migrate]
    secrets: [owner_password, app_password]
    environment:
      DB_HOST: postgres
      DB_NAME: storefront
      DB_USER: storefront_owner
      DB_PASSWORD_FILE: /run/secrets/owner_password
      DB_SSLMODE: disable
      APP_DB_PASSWORD_FILE: /run/secrets/app_password
  api:
    <<: *runtime
    command: [api]
    environment:
      <<: *environment
      LISTEN_ADDR: 0.0.0.0:8093
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    ports: [172.17.0.1:18793:8093]
  worker:
    <<: *runtime
    command: [worker]
    environment: *environment
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes: [./dist:/usr/share/nginx/html:ro, ./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [172.17.0.1:13211:80]
secrets:
  owner_password:
    file: .secrets/owner-password
  app_password:
    file: .secrets/app-password
  auth_secret:
    file: .secrets/auth-secret
  fulfillment_secret:
    file: .secrets/fulfillment-secret
volumes:
  postgres:
